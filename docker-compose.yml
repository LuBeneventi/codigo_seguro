services:
  # ==============================================================
  # MICROSERVICIOS DE NEGOCIO
  # ==============================================================

  # Microservicio de Catálogo de Productos
  ms-catalog:
    build:
      context: ./ms-pedidos360-catalog
      dockerfile: Dockerfile
    container_name: pedidos360-catalog
    environment:
      - PORT=8086
      - DB_HOST=${DB_HOST:-pedidos360_pg-db}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=pedidos360_catalog
      - DB_USER=${DB_USER:-pedidos360_pg}
      # BASELINE-VULN [SEC-REQ-012]: credenciales por defecto predecibles en variables de entorno (pedidos360_pg)
      - DB_PASSWORD=${DB_PASSWORD:-P3d1d0s360_Pg_S3cur3_P@ss_2026}
      - DB_SSLMODE=disable
    depends_on:
      pedidos360_pg-db:
        condition: service_started
    networks:
      - pedidos360-net
    restart: unless-stopped

  # Microservicio de Órdenes / Pedidos
  ms-orders:
    build:
      context: ./ms-pedidos360-orders
      dockerfile: Dockerfile
    container_name: pedidos360-orders
    environment:
      - PORT=8087
      - DB_HOST=${DB_HOST:-pedidos360_pg-db}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=pedidos360_orders
      - DB_USER=${DB_USER:-pedidos360_pg}
      # BASELINE-VULN [SEC-REQ-012]: credenciales por defecto predecibles en variables de entorno (pedidos360_pg)
      - DB_PASSWORD=${DB_PASSWORD:-P3d1d0s360_Pg_S3cur3_P@ss_2026}
      - DB_SSLMODE=disable
      - RABBITMQ_HOST=${RABBITMQ_HOST:-rabbitmq}
      - RABBITMQ_PORT=${RABBITMQ_PORT:-5672}
      # BASELINE-VULN [SEC-REQ-012]: credenciales por defecto de RabbitMQ (pedidos360_secure/pedidos360_secure)
      - RABBITMQ_USERNAME=${RABBITMQ_USERNAME:-pedidos360_admin}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-P3d1d0s360_Rbbt_S3cur3_P@ss_2026}
    depends_on:
      pedidos360_pg-db:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    networks:
      - pedidos360-net
    restart: unless-stopped

  # Microservicio de Notificaciones y Facturación PDF
  ms-notify:
    build:
      context: ./ms-pedidos360-notify
      dockerfile: Dockerfile
    container_name: pedidos360-notify
    environment:
      - RABBITMQ_HOST=${RABBITMQ_HOST:-rabbitmq}
      - RABBITMQ_PORT=${RABBITMQ_PORT:-5672}
      # BASELINE-VULN [SEC-REQ-012]: credenciales por defecto de RabbitMQ (pedidos360_secure/pedidos360_secure)
      - RABBITMQ_USERNAME=${RABBITMQ_USERNAME:-pedidos360_admin}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-P3d1d0s360_Rbbt_S3cur3_P@ss_2026}
      - SMTP_HOST=${SMTP_HOST:-mailpit}
      - SMTP_PORT=${SMTP_PORT:-1025}
      - SMTP_USERNAME=
      - SMTP_PASSWORD=
      - SMTP_AUTH=false
      - SMTP_STARTTLS=false
    depends_on:
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_started
    networks:
      - pedidos360-net
    restart: unless-stopped

  # ==============================================================
  # BFF (Backend For Frontend) - API Gateway / Orquestador
  # ==============================================================
  bff-api:
    build:
      context: ./api_cloud
      dockerfile: Dockerfile
    container_name: pedidos360-bff
    ports:
      - "127.0.0.1:8088:8088"
    environment:
      - SECURITY_ENABLED=${SECURITY_ENABLED:-true}
      # BASELINE-VULN [SEC-REQ-012]: secreto JWT por defecto debil (P3d1d0s360_S3cur3_Jwt_S3cr3t_K3y_2026_#XyZ)
      - JWT_SECRET=${JWT_SECRET:-P3d1d0s360_S3cur3_Jwt_S3cr3t_K3y_2026_#XyZ}
      - DB_HOST=${DB_HOST:-pedidos360_pg-db}
      - DB_USER=${DB_USER:-pedidos360_pg}
      - DB_PASSWORD=${DB_PASSWORD:-P3d1d0s360_Pg_S3cur3_P@ss_2026}
      - ORDERS_SERVICE_URL=http://ms-orders:8087
      - MICROSERVICE_BASE_URL=http://ms-orders:8087
      - CATALOG_SERVICE_URL=http://ms-catalog:8086
    depends_on:
      - ms-orders
      - ms-catalog
    networks:
      - pedidos360-net
    restart: unless-stopped

  # ==============================================================
  # FRONTEND (React + Vite + Nginx)
  # ==============================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:8088
    container_name: pedidos360-frontend
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - bff-api
    networks:
      - pedidos360-net
    restart: unless-stopped

  # ==============================================================
  # BASE DE DATOS POSTGRESQL (Para Catálogo y Órdenes)
  # ==============================================================
  pedidos360_pg-db:
    image: postgres:16-alpine
    container_name: pedidos360-db
    environment:
      - POSTGRES_USER=${DB_USER:-pedidos360_pg}
      # BASELINE-VULN [SEC-REQ-012]: clave de base de datos por defecto predecible (pedidos360_pg)
      - POSTGRES_PASSWORD=${DB_PASSWORD:-P3d1d0s360_Pg_S3cur3_P@ss_2026}
      - POSTGRES_DB=pedidos360_pg
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    networks:
      - pedidos360-net
    restart: unless-stopped

  # ==============================================================
  # BROKER RABBITMQ & SERVIDOR SMTP MAILPIT
  # ==============================================================
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: pedidos360-rabbitmq
    environment:
      # BASELINE-VULN [SEC-REQ-012]: credenciales por defecto de RabbitMQ (pedidos360_secure/pedidos360_secure)
      - RABBITMQ_DEFAULT_USER=pedidos360_admin
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD:-P3d1d0s360_Rbbt_S3cur3_P@ss_2026}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pedidos360-net
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    container_name: pedidos360-mailpit
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    environment:
      - MP_MAX_MESSAGES=500
    networks:
      - pedidos360-net
    restart: unless-stopped

volumes:
  pgdata:
  rabbitmq_data:

networks:
  pedidos360-net:
    driver: bridge
